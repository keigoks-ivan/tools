<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7e8">
<title>海象小樂園</title>
<meta name="description" content="海象小樂園：跟海象一起學注音，或練英文 sight words。">
<style>
:root{--ink:#24304a;--muted:#657086;--blue:#3f72d8;--blue-soft:#eaf3ff;--green:#2e9672;--green-soft:#e9fbf2;--orange:#df7049;--orange-soft:#fff0e8;--purple:#8562bd;--yellow:#f5c84c;--coral:#ff8065;--mint:#a5e4d4;--paper:#fffefa;--bg:#fff7e8;--line:#d8e4ed;--shadow:0 16px 0 rgba(76,103,151,.07),0 18px 44px rgba(40,55,95,.11)}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,rgba(255,128,101,.18),transparent 22%),radial-gradient(circle at 91% 20%,rgba(165,228,212,.32),transparent 24%),radial-gradient(circle at 74% 88%,rgba(245,200,76,.17),transparent 20%),var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{font:inherit;color:inherit}
.topbar{min-height:72px;padding:9px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:center;gap:11px;background:rgba(255,254,250,.94);border-bottom:3px solid #d8ebf5;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:11px;font-size:clamp(19px,2vw,24px);font-weight:900;letter-spacing:.03em}
.brand-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#dff5ef;border:3px solid #fff;box-shadow:0 4px 0 #b9ddd4;overflow:hidden;flex:0 0 auto}
.brand-mark img{width:64px;height:64px;object-fit:contain;transform:translateY(5px)}
.layout{width:min(1180px,100%);margin:0 auto;padding:0 clamp(16px,4vw,32px) 8px}
.stage{position:relative;overflow:hidden;margin:22px auto 26px;padding:38px 20px 66px;max-width:960px;border-radius:34px;border:3px solid #cfe2fb;background:linear-gradient(180deg,#dceeff 0%,#fdf6e6 62%,var(--bg) 100%);box-shadow:var(--shadow);text-align:center}
.bubble{position:absolute;bottom:-42px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);pointer-events:none;animation:bubble-float 10s ease-in infinite}
.bubble.b1{left:8%;width:22px;height:22px;animation-delay:0s;animation-duration:9s}
.bubble.b2{left:20%;width:14px;height:14px;animation-delay:1.6s;animation-duration:11s}
.bubble.b3{left:38%;width:18px;height:18px;animation-delay:3.1s;animation-duration:8.5s}
.bubble.b4{left:58%;width:12px;height:12px;animation-delay:.7s;animation-duration:10.5s}
.bubble.b5{left:75%;width:20px;height:20px;animation-delay:2.3s;animation-duration:9.5s}
.bubble.b6{left:89%;width:15px;height:15px;animation-delay:4s;animation-duration:11.5s}
@keyframes bubble-float{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.75}85%{opacity:.4}100%{transform:translateY(-320px) scale(1.2);opacity:0}}
.wave-wrap{position:absolute;left:-12%;right:-12%;bottom:-4px;height:56px;z-index:1;animation:wave-sway 6.5s ease-in-out infinite}
.wave-wrap svg{width:100%;height:100%;display:block}
@keyframes wave-sway{0%,100%{transform:translateX(-3%)}50%{transform:translateX(3%)}}
.walrus-wrap{position:relative;display:inline-block;z-index:2;margin-top:4px}
.walrus-img{width:min(210px,50vw);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 14px 8px rgba(52,71,105,.18));animation:walrus-float 3s ease-in-out infinite}
.wave-hand{position:absolute;top:6%;right:2%;font-size:clamp(26px,6vw,38px);transform-origin:70% 70%;display:inline-block;animation:wave-hand 2.6s ease-in-out infinite}
.walrus-wrap.jump .walrus-img{animation:walrus-jump .35s ease}
@keyframes walrus-float{0%{transform:translateY(0) rotate(0deg)}30%{transform:translateY(-9px) rotate(-3deg)}60%{transform:translateY(-3px) rotate(2deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes wave-hand{0%,55%,100%{transform:rotate(0deg)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(16deg)}40%{transform:rotate(-4deg)}}
@keyframes walrus-jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-24px) scale(1.06)}65%{transform:translateY(3px) scale(.97)}100%{transform:translateY(0) scale(1)}}
.hero-title{position:relative;z-index:2;margin:16px 0 6px;font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:-.01em}
.hero-sub{position:relative;z-index:2;margin:0;color:var(--muted);font-size:clamp(14px,2vw,17px);line-height:1.6}
.cards{width:min(960px,100%);margin:4px auto 10px;padding:0 clamp(16px,4vw,32px);display:grid;grid-template-columns:1fr 1fr;gap:18px}
.game-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:230px;padding:28px 24px;background:#fff;border:2px solid var(--line);border-radius:25px;box-shadow:0 8px 0 rgba(66,86,125,.10);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.game-card:hover,.game-card:focus-visible{transform:translateY(-4px)}
.game-card.zhuyin{border-color:#cfe2fb}
.game-card.zhuyin:hover,.game-card.zhuyin:focus-visible{border-color:var(--blue);box-shadow:0 12px 0 rgba(63,114,216,.14)}
.game-card.sight{border-color:#f7d6c8}
.game-card.sight:hover,.game-card.sight:focus-visible{border-color:var(--orange);box-shadow:0 12px 0 rgba(223,112,73,.16)}
.card-big{font-size:clamp(38px,7vw,52px);font-weight:900;line-height:1}
.game-card.zhuyin .card-big{color:var(--blue)}
.game-card.sight .card-big{color:var(--orange)}
.card-title{font-size:21px;font-weight:900}
.card-sub{color:var(--muted);font-size:14px;line-height:1.55}
.card-cta{margin-top:auto;padding-top:12px;font-size:16px;font-weight:900}
.game-card.zhuyin .card-cta{color:var(--blue)}
.game-card.sight .card-cta{color:var(--orange)}
.footer-note{text-align:center;color:#737d91;font-size:13px;line-height:1.7;padding:14px 20px 30px}
button:focus-visible,a:focus-visible{outline:4px solid rgba(63,114,216,.28);outline-offset:3px}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
@media(max-width:600px){.topbar{padding:8px 12px}.brand{font-size:16px}.brand-mark{width:44px;height:44px}.brand-mark img{width:54px;height:54px}.stage{padding:30px 16px 54px;border-radius:27px;margin:16px auto 20px}.game-card{min-height:190px;padding:22px 18px;border-radius:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark"><img src="./zhuyin/assets/walrus-mascot.png" alt=""></span><span>海象小樂園</span></div></header>
<main class="layout">
  <section class="stage">
    <span class="bubble b1" aria-hidden="true"></span>
    <span class="bubble b2" aria-hidden="true"></span>
    <span class="bubble b3" aria-hidden="true"></span>
    <span class="bubble b4" aria-hidden="true"></span>
    <span class="bubble b5" aria-hidden="true"></span>
    <span class="bubble b6" aria-hidden="true"></span>
    <div class="walrus-wrap" id="walrusWrap">
      <img class="walrus-img" src="./zhuyin/assets/walrus-mascot.png" alt="海象揮手歡迎你">
      <span class="wave-hand" aria-hidden="true">👋</span>
    </div>
    <h1 class="hero-title">今天想玩哪一個？</h1>
    <p class="hero-sub">跟海象一起學注音，或練英文單字。</p>
    <div class="wave-wrap" aria-hidden="true">
      <svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,45 C150,95 350,5 600,45 C850,85 1050,15 1200,50 L1200,120 L0,120 Z" fill="#eaf3ff"></path></svg>
    </div>
  </section>
  <section class="cards">
    <a class="game-card zhuyin" href="./zhuyin/">
      <span class="card-big">ㄅㄆㄇ</span>
      <strong class="card-title">注音小樂園</strong>
      <span class="card-sub">聽一聽、拼一拼，從注音到國字</span>
      <span class="card-cta">開始 →</span>
    </a>
    <a class="game-card sight" href="./sight-words/">
      <span class="card-big">ABC</span>
      <strong class="card-title">英文 Sight Words</strong>
      <span class="card-sub">聽一聽、找一找、讀一讀</span>
      <span class="card-cta">開始 →</span>
    </a>
  </section>
  <div class="footer-note">可以依孩子當天的狀況自由練習。</div>
</main>
<script>
(function(){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var walrusWrap=document.getElementById('walrusWrap');
  var cards=document.querySelectorAll('.game-card');
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener('click',function(e){
      if(e.defaultPrevented)return;
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button===1)return;
      if(reduce||!walrusWrap)return;
      var href=this.getAttribute('href');
      e.preventDefault();
      walrusWrap.classList.add('jump');
      setTimeout(function(){window.location.href=href},350);
    });
  }
})();
</script>
</body>
</html>
