<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>夜市大街行軍關 灰模預覽</title>
  <style>
    html,body{margin:0;height:100%;background:#0d0f1c;overflow:hidden;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;color:#eee}
    canvas{display:block;width:100vw;height:100vh}
    #hud{position:fixed;inset:0;pointer-events:none}
    .top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center}
    .top small{display:block;color:#b9a9d9;font-size:12px;letter-spacing:.15em}
    .top b{display:block;font-size:22px;letter-spacing:.08em;text-shadow:0 2px 8px #000}
    #foe{margin:6px auto 0;width:320px;font-size:12px}
    #foe i{display:block;height:7px;background:#221c30;border-radius:4px;overflow:hidden;margin-top:3px}
    #foe i u{display:block;height:100%;background:linear-gradient(90deg,#ff4d6a,#ffb35c)}
    #hint{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-size:16px;color:#ffe9a8;text-shadow:0 2px 8px #000}
    .left{position:absolute;left:12px;top:10px;font-size:13px;line-height:1.5;text-shadow:0 1px 4px #000}
    .left i{display:inline-block;width:160px;height:8px;background:#222;vertical-align:middle;border-radius:4px;overflow:hidden}
    .left i u{display:block;height:100%;background:#5cff8a}
    #combo{position:absolute;right:16px;top:30%;font-size:28px;color:#ffd9a0;text-shadow:0 2px 8px #000}
    #help{position:absolute;left:12px;bottom:10px;font-size:11px;color:#aab;line-height:1.5}
    #result{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:26px;text-align:center;text-shadow:0 2px 10px #000}
  </style>
  <script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/addons/"}}</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <div class="top"><small id="segName"></small><b id="objective"></b><div id="foe" hidden><span id="foeName"></span><i><u id="foeFill"></u></i></div></div>
    <div id="hint"></div>
    <div class="left">HP <i><u id="hpFill"></u></i> <span id="hpText"></span><br>靈力 <span id="energy"></span>　擊倒 <span id="kills"></span><br><span id="diag"></span></div>
    <div id="combo"></div>
    <div id="result"></div>
    <div id="help">WASD 移動 · J 攻 · K 重 · Shift 閃 · E 絕招 · Space 跳 · B 自動駕駛 · C 切鏡頭（跟隨／環繞／俯瞰）· 1–4 跳段 · R 重來<br>環繞鏡頭：拖曳旋轉、滾輪縮放 · 參數 ?seg=0-3&amp;bot=1&amp;warp=秒&amp;freeze=1&amp;cam=follow|orbit|top&amp;mobile=1&amp;seed=17</div>
  </div>
  <script type="module" src="./march-preview.js"></script>
</body>
</html>
