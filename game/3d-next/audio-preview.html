<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>紫刃音效試聽</title>
  <style>
    :root{--bg:#0d0f1c;--card:#171a2c;--line:#2b2f4a;--ink:#ece6ff;--dim:#a79fc2;--acc:#b98cff;--ok:#8dffb0}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
    main{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
    h1{font-size:18px;letter-spacing:.08em;margin:6px 0 4px}
    h2{font-size:13px;letter-spacing:.14em;color:var(--dim);margin:22px 0 8px;text-transform:uppercase}
    p{color:var(--dim);font-size:12px;line-height:1.6;margin:4px 0}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    button{min-height:40px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
    button:hover{border-color:var(--acc)}
    button.primary{background:#3b2a66;border-color:var(--acc);font-weight:600}
    button[aria-pressed="true"]{background:#2a3d33;border-color:var(--ok)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
    .snd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
    .snd b{display:block;font-size:12px;margin-bottom:6px}
    .snd small{color:var(--dim);font-size:11px}
    .snd .row button{min-height:32px;padding:4px 9px;font-size:12px}
    label{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
    input[type=range]{width:140px}
    #status{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap;background:#0a0c16;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}
    #log{font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--dim)}
  </style>
</head>
<body>
  <main>
    <h1>紫刃音效試聽　/　MARCH AUDIO</h1>
    <p>全部為程式合成的原創音樂與音效（game/scripts/audio/make_audio.py）。按「啟用聲音」後才建立 AudioContext（手機需要手勢）。</p>
    <div class="row">
      <button id="unlock" class="primary" type="button">啟用聲音</button>
      <button id="mute" type="button" aria-pressed="false">靜音</button>
      <label>音樂 <input id="vmusic" type="range" min="0" max="1" step="0.01"></label>
      <label>音效 <input id="vsfx" type="range" min="0" max="1" step="0.01"></label>
      <button id="slow" type="button" aria-pressed="false">慢動作（濾波）</button>
      <button id="pause" type="button" aria-pressed="false">暫停效果</button>
    </div>
    <div id="status">尚未啟用</div>

    <h2>Music</h2>
    <div class="row" id="music"></div>
    <p>「接縫」從循環終點前 4 秒播放，用來聽循環接回開頭是否無縫。</p>

    <h2>Event scenes</h2>
    <div class="row" id="scenes"></div>

    <h2>SFX（每個變體）</h2>
    <div class="grid" id="sfx"></div>
    <pre id="log"></pre>
  </main>
  <script type="module" src="./audio-preview.js?v=20260925b"></script>
</body>
</html>
