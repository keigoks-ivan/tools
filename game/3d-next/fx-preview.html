<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Combat FX 預覽</title>
  <style>
    html,body{margin:0;height:100%;background:#0d0f1c;overflow:hidden;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#eee}
    canvas{display:block;width:100vw;height:100vh}
    #hud{position:fixed;inset:0;pointer-events:none}
    #panel{position:fixed;left:10px;bottom:8px;font-size:11px;line-height:1.55;color:#b9b2cc;text-shadow:0 1px 3px #000;pointer-events:auto}
    #panel b{color:#efe6ff}
    #panel a{color:#cdb8ff}
    #diag{position:fixed;left:10px;top:8px;font:11px/1.4 ui-monospace,Menlo,monospace;color:#cfc6e6;text-shadow:0 1px 3px #000;white-space:pre}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;letter-spacing:.2em;color:#b9a9d9}
    body.capture #panel,body.capture #diag{display:none}
  </style>
  <script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/addons/"}}</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="diag"></div>
  <div id="loading">LOADING…</div>
  <div id="panel">
    <b>Combat FX 預覽</b>　自動連段：五段 → 蓄力 → 五段 → 無雙 → 閃避 → 跳斬＋下墜（循環）<br>
    J 攻 · K 重 · E 無雙 · L 閃 · Space 暫停自動 · C 切鏡頭 · F 切特效（新／舊／關） · Q 切畫質<br>
    參數 ?fx=new|legacy|off &amp; quality=desktop|mobile &amp; cam=fixed|follow|close &amp; enemies=10 &amp; true=1（真・無雙）&amp; flurry=1（長無雙）&amp; capture=1
  </div>
  <script type="module" src="./fx-preview.js?v=20260925a"></script>
</body>
</html>
