<!DOCTYPE html>
<html lang="zh-Hant" data-art="b" data-tone="warm">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>林口店面選址・地圖找位置</title>
<meta name="description" content="在林口地圖上點一個位置或搜尋地址，看半徑內的住戶、所得、人流替代指標、同業和店面行情。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="linkou.css?v=20261122a">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f8fc; color: #1e3a5f; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-variant-numeric: tabular-nums; }
  .mp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .mp-top { flex: 0 0 44px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #1e3a5f; color: #fff; font-size: 14px; }
  .mp-top a { color: #fff; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; white-space: nowrap; }
  .mp-top a:hover { text-decoration: underline; }
  .mp-top .mp-title { font-size: 13px; color: #c7d6e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-top .mp-links { margin-left: auto; display: flex; gap: 14px; }
  .mp-top .mp-links a { font-weight: 400; font-size: 13px; color: #c7d6e8; }
  .mp-main { flex: 1 1 auto; min-height: 0; display: flex; }
  .mp-mapwrap { position: relative; flex: 1 1 auto; min-width: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; z-index: 0; }

  /* 浮在地圖上的控制 */
  .mp-ctl { position: absolute; z-index: 1100; top: 10px; left: 10px; width: 440px; max-width: calc(100% - 78px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .mp-ctl > * { pointer-events: auto; }
  .mp-search { position: relative; }
  .mp-search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; height: 44px; padding: 0 40px 0 14px; border: 1px solid #ccd9e8; border-radius: 8px; background: #fff; color: #1e3a5f; box-shadow: 0 2px 8px rgba(30,58,95,.18); appearance: none; -webkit-appearance: none; }
  .mp-search input:focus { outline: 2px solid #2563eb; outline-offset: -1px; }
  .mp-search input::-webkit-search-cancel-button { display: none; }
  .mp-search .clr { position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: none; font-size: 20px; color: #5a7a9a; cursor: pointer; }
  #mpHits { position: absolute; left: 0; right: 0; top: 48px; margin: 0; padding: 4px 0; list-style: none; background: #fff; border: 1px solid #ccd9e8; border-radius: 8px; box-shadow: 0 6px 20px rgba(30,58,95,.2); max-height: 50vh; overflow-y: auto; }
  #mpHits[hidden] { display: none; }
  #mpHits li { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; font-size: 14px; cursor: pointer; line-height: 1.4; }
  #mpHits li:hover, #mpHits li:focus { background: #eef3f9; }
  #mpHits li.none { cursor: default; color: #4a6080; font-size: 13px; padding: 10px 14px; line-height: 1.6; }
  #mpHits .h-t { flex: none; font-size: 11px; font-weight: 700; color: #b45309; background: #fff7ed; border-radius: 4px; padding: 1px 6px; }
  .mp-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mp-btn, .mp-btns .radius-bar button { font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #ccd9e8; background: #fff; color: #1e3a5f; cursor: pointer; box-shadow: 0 2px 8px rgba(30,58,95,.18); }
  .mp-btn.on, .mp-btns .radius-bar button.on { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .mp-btns .radius-bar { margin: 0; gap: 0; flex-wrap: nowrap; }
  .mp-btns .radius-bar button { border-radius: 0; box-shadow: none; padding: 0 12px; flex: none; margin-left: -1px; }
  .mp-btns .radius-bar { box-shadow: 0 2px 8px rgba(30,58,95,.18); border-radius: 8px; overflow: hidden; }
  .mp-btns .radius-bar .rb-k { display: none; }
  .mp-layers { position: absolute; z-index: 1090; top: 110px; left: 10px; width: 380px; max-width: calc(100% - 78px); max-height: calc(100% - 130px); overflow-y: auto; background: #fff; border: 1px solid #ccd9e8; border-radius: 8px; box-shadow: 0 6px 20px rgba(30,58,95,.22); padding: 10px 12px 12px; }
  .mp-layers[hidden] { display: none; }
  .mp-layers .lp-h { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .mp-layers .lp-h button { width: 44px; height: 44px; margin: -8px -10px -8px 0; border: 0; background: none; font-size: 22px; color: #5a7a9a; cursor: pointer; }
  .mp-layers .layer-bar { padding: 4px 0 0; margin: 0; background: none; flex-direction: column; flex-wrap: nowrap; gap: 4px; }
  .mp-layers .layer-bar label { min-height: 36px; }
  .mp-layers .layer-bar .fl-row { flex-direction: row; }
  .mp-tip { display: none; }
  .mp-toast { position: absolute; z-index: 1300; left: 50%; top: 66px; transform: translateX(-50%); background: #1e3a5f; color: #fff; font-size: 13px; line-height: 1.6; padding: 8px 14px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 86%; text-align: center; }
  .mp-toast.on { opacity: 1; }
  .map-legend { max-width: 220px; }

  /* 右側欄（電腦）／底部抽屜（手機） */
  .mp-side { flex: 0 0 380px; width: 380px; display: flex; flex-direction: column; background: #f4f7fc; border-left: 1px solid #ccd9e8; min-height: 0; }
  .mp-grip, .mp-sum { display: none; }
  .mp-side .finder-panel { position: static; height: auto; flex: 1 1 auto; overflow-y: auto; border: 0; border-radius: 0; box-shadow: none; margin: 0; }
  .mp-hint { color: #4a6080; font-size: 13px; line-height: 1.8; padding: 6px 4px; }
  .mp-hint b { color: #1e3a5f; }

  @media (max-width: 899px) {
    .mp-top .mp-links { display: none; }
    .mp-ctl { width: auto; right: 62px; max-width: none; }
    .mp-layers { z-index: 1150; width: auto; left: 10px; right: 10px; max-width: none; top: 10px; max-height: calc(100% - 20px); }
    .mp-side { position: fixed; z-index: 1200; left: 0; right: 0; bottom: 0; width: auto; flex: none; height: 85vh; height: 85dvh; border: 0; border-radius: 14px 14px 0 0; box-shadow: 0 -4px 18px rgba(30,58,95,.28); transform: translateY(110%); transition: transform .26s cubic-bezier(.2,.8,.2,1); will-change: transform; background: #f4f7fc; }
    .mp-side[data-sheet="hide"] { box-shadow: none; }
    .mp-grip { display: flex; justify-content: center; align-items: center; height: 22px; flex: none; touch-action: none; cursor: grab; }
    .mp-grip i { width: 40px; height: 4px; border-radius: 2px; background: #b3c0cf; }
    .mp-sum { display: block; flex: none; padding: 0 14px 10px; touch-action: none; cursor: pointer; background: #f4f7fc; border-bottom: 1px solid #e3ebf5; min-height: 80px; }
    .mp-sum.pulse { animation: mpPulse .9s ease-out; }
    @keyframes mpPulse { 0% { background: #ffedd5; } 100% { background: #f4f7fc; } }
    .mp-sum .s-t { font-size: 14px; line-height: 1.5; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .mp-sum .s-t b { font-size: 16px; }
    .mp-sum .s-r { font-size: 12px; color: #b45309; font-weight: 600; }
    .mp-sum .s-k { display: flex; gap: 8px; margin-top: 6px; }
    .mp-sum .s-k span { flex: 1 1 0; min-width: 0; background: #fff; border: 0.5px solid #ccd9e8; border-radius: 8px; padding: 4px 8px; }
    .mp-sum .s-k i { display: block; font-style: normal; font-size: 11px; color: #5a7a9a; line-height: 1.4; }
    .mp-sum .s-k b { display: block; font-size: 14px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-side[data-sheet="peek"] .finder-panel { overflow: hidden; }
    .mp-hint { display: none; }
    .mp-tip { display: block; position: absolute; z-index: 1100; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1e3a5f; color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 22px; box-shadow: 0 4px 14px rgba(0,0,0,.3); white-space: nowrap; pointer-events: none; }
    .mp-tip.gone { display: none; }
  }
</style>
</head>
<body data-view="map">
<div class="mp">
  <header class="mp-top">
    <a href="index.html">← 林口店面選址</a>
    <span class="mp-title">點地圖找位置</span>
    <span class="mp-links"><a href="industry.html">我要開某種店</a><a href="area.html">看某個商圈</a></span>
  </header>
  <div class="mp-main">
    <div class="mp-mapwrap">
      <div id="map" role="application" aria-label="林口店面地圖"></div>
      <div class="mp-ctl">
        <div class="mp-search">
          <input id="mpQ" type="search" inputmode="search" enterkeyhint="search" placeholder="搜尋路名、門牌、商圈、捷運站" autocomplete="off" aria-label="搜尋地點" aria-controls="mpHits">
          <button type="button" class="clr" id="mpQclr" aria-label="清除">×</button>
          <ul id="mpHits" role="listbox" hidden></ul>
        </div>
        <div class="mp-btns">
          <button type="button" class="mp-btn" id="mpLayers" aria-expanded="false" aria-controls="mpLayerPanel">圖層</button>
          <button type="button" class="mp-btn" id="mpLoc">我的位置</button>
          <div class="radius-bar" id="radiusBar" role="group" aria-label="分析半徑">
            <span class="rb-k">半徑</span>
            <button type="button" data-r="300">300 公尺</button>
            <button type="button" data-r="500" class="on">500 公尺</button>
            <button type="button" data-r="1000">1,000 公尺</button>
          </div>
        </div>
      </div>
      <div class="mp-layers" id="mpLayerPanel" hidden>
        <div class="lp-h"><span>圖層</span><button type="button" id="mpLayersX" aria-label="關閉圖層面板">×</button></div>
        <div class="layer-bar" id="layerBar" role="group" aria-label="圖層開關"></div>
      </div>
      <div class="mp-tip" id="mpTip">點地圖任一點，看半徑內的住戶和同業</div>
      <div class="mp-toast" id="mpToast" role="status" aria-live="polite"></div>
    </div>
    <aside class="mp-side" id="mpSide" aria-label="分析結果">
      <div class="mp-grip" id="mpGrip" role="button" aria-label="拉開或收起結果"><i></i></div>
      <div class="mp-sum" id="mpSum"><div class="s-t"><b>點地圖任一點</b></div></div>
      <div class="finder-panel" id="catchPanel" aria-live="polite">
        <div class="mp-hint"><b>點地圖上的任一點，或在上方搜尋。</b><br>這裡會列出半徑內的住戶、所得、人流替代指標、同業、店面行情和未來住戶。半徑可選 300、500、1,000 公尺；「圖層」可以看 591 掛牌、補習班、各業態店家等。</div>
      </div>
    </aside>
  </div>
</div>
<script src="linkou.js?v=20261122a"></script>
</body>
</html>
